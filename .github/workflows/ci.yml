name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, analyse, test
    # Pinned, not `ubuntu-latest`: the `-latest` label is migrated to a new Ubuntu release
    # over a one-to-two month window, which silently changes PHP, ICU and the preinstalled
    # database clients under the suite. Raise this deliberately, like any other tool version.
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crm_testing
          MYSQL_USER: crm
          MYSQL_PASSWORD: crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: crm_testing
      DB_USERNAME: crm
      DB_PASSWORD: crm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PHP 8.3 is the production floor (decision D-1); local development runs 8.4.
      # The list names every `ext-*` in composer.json explicitly - dom, fileinfo, intl,
      # mbstring, openssl, pdo_mysql, xmlreader and zip - so `composer install` can never
      # fail a platform check because an extension only happened to be in the base image.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, xml, xmlreader, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Waits with the PHP set up above, through the very credentials and database the suite
      # uses, so the step proves what PHPUnit needs instead of proving that a `mysql` client
      # happens to be installed on the runner image and that root can connect.
      - name: Wait for MySQL
        run: |
          connect='new PDO("mysql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));'
          for i in {1..30}; do
            if php -r "$connect" 2>/dev/null; then
              echo "MySQL is ready for $DB_USERNAME@$DB_HOST:$DB_PORT/$DB_DATABASE."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL did not become ready in time. The last connection attempt reported:"
          php -r "$connect"
          exit 1

      - name: PHPUnit
        run: vendor/bin/phpunit
