name: Uptime

# External monitor for the live site (decision D-16).
# Runbook: docs/DEPLOYMENT.md (section 9 describes this file).
#
# Every 15 minutes (and by hand: Actions > Uptime > Run workflow) this requests
# the site's health endpoint `/up`. In production `/up` answers 500 when the
# scheduler heartbeat is missing or older than ten minutes
# (App\Listeners\FailHealthCheckWithoutSchedulerHeartbeat), so one request
# covers both "the site is down" and "the host's cron stopped running the
# scheduler".
#
# - A run succeeds on the first 200. Otherwise it tries three times, about two
#   minutes apart (a release clears the heartbeat for a minute), and then fails.
#   GitHub e-mails a failed scheduled run to the owner; a green run is silent.
# - The URL comes from the repository secret UPTIME_URL (the site's full https
#   /up address). Host names stay out of this public repository (A-24): the
#   secret reaches the shell through env, is never echoed, and curl's own error
#   text (which names the host) is discarded; only the HTTP status and curl's
#   exit code are logged. Without the secret the run skips with a notice.
# - GitHub disables scheduled workflows of a public repository after 60 days
#   without repository activity; re-enable it under Actions > Uptime.
# No host, URL or credential is written in this file.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check the health endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Request /up (three attempts, about two minutes apart)
        env:
          UPTIME_URL: ${{ secrets.UPTIME_URL }}
        run: |
          if [ -z "$UPTIME_URL" ]; then
            echo "::notice title=Uptime check skipped::The UPTIME_URL repository secret is not set, so nothing was checked (docs/DEPLOYMENT.md section 9)."
            exit 0
          fi

          attempts=3
          status=000
          rc=0
          for attempt in $(seq 1 "$attempts"); do
            rc=0
            # -f: an HTTP error is a failure; stderr is dropped because curl's messages name the host.
            status="$(curl --max-time 30 -fsS -o /dev/null -w '%{http_code}' "$UPTIME_URL" 2>/dev/null)" || rc=$?
            status="${status:-000}"

            if [ "$rc" -eq 0 ] && [ "$status" = "200" ]; then
              echo "The site answered 200 on attempt $attempt of $attempts."
              exit 0
            fi

            echo "Attempt $attempt of $attempts: HTTP status $status (curl exit code $rc)."
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 120
            fi
          done

          echo "::error title=Site down or scheduler stopped::The health endpoint did not answer 200 in $attempts attempts about two minutes apart. Last HTTP status: $status (curl exit code $rc). A 500 means the application answered but failed its health check (most often a missing or stale scheduler heartbeat; the reason is in the site's log); 000 means no HTTP answer at all. See docs/DEPLOYMENT.md section 9."
          exit 1
