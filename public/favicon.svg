<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- «فيروز» (Fayrouz) mark, A-9 as amended 2026-09-20: the brand teal with
         an ascending-bars motif - growth, the thing a CRM exists to show.
         Neutral and geometric on purpose; replace when the owner adopts a
         wordmark. -->
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0e7490"/>
            <stop offset="1" stop-color="#155e75"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#g)"/>
    <rect x="14" y="34" width="8" height="16" rx="2.5" fill="#ffffff" opacity="0.65"/>
    <rect x="28" y="26" width="8" height="24" rx="2.5" fill="#ffffff" opacity="0.82"/>
    <rect x="42" y="16" width="8" height="34" rx="2.5" fill="#ffffff"/>
</svg>
